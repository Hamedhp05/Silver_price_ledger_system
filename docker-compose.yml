services:
  postgres:
    image: postgres:15-alpine
    container_name: silver_postgres

    environment:
      POSTGRES_USER: silver_user
      POSTGRES_PASSWORD: silver_pass
      POSTGRES_DB: silver_ledger

    ports:
      - "5433:5432"

    volumes:
      - silver_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silver_user -d silver_ledger"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  app:
    build: .

    container_name: silver_app

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+psycopg2://silver_user:silver_pass@postgres:5432/silver_ledger

    ports:
      - "8000:8000"

    volumes:
      - ./app/prediction/models:/app/app/prediction/models
      - ./.env.development:/app/.env.development

    restart: unless-stopped


volumes:
  silver_postgres_data: