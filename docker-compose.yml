services:
  postgres:
    image: postgres:15-alpine
    container_name: silver_postgres_dev
    env_file:
      - .env.development
    ports:
      - "5433:5432"
    volumes:
      - silver_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silver_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  silver_postgres_data: